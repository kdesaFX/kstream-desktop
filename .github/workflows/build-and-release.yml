name: Build and Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Azure Artifact Signing (optional — unsigned if secrets missing)
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
      AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
      AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
      AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
    steps:
      - name: Checkout desktop
        uses: actions/checkout@v4

      - name: Checkout kstream web
        uses: actions/checkout@v4
        with:
          repository: kdesaFX/kstream
          ref: production
          path: kstream-web
          token: ${{ secrets.RELEASES_REPO_TOKEN }}

      - name: Checkout providers
        uses: actions/checkout@v4
        with:
          repository: kdesaFX/providers
          ref: production
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          path: providers-src

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build providers and wire into kstream
        shell: pwsh
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: |
          Push-Location providers-src
          pnpm install --ignore-workspace
          pnpm exec vite build
          pnpm pack --pack-destination ..
          Pop-Location
          $providerPackage = (Get-ChildItem -Path . -Filter "p-stream-providers-*.tgz" | Select-Object -First 1).Name
          if (-not $providerPackage) { throw "Provider package was not packed" }
          node -e "const fs=require('fs'); const provider=process.argv[1]; const p='kstream-web/package.json'; const pkg=JSON.parse(fs.readFileSync(p,'utf8')); pkg.dependencies['@p-stream/providers']='file:../'+provider; fs.writeFileSync(p, JSON.stringify(pkg,null,2)+'\n');" $providerPackage
          if (Test-Path kstream-web/pnpm-lock.yaml) { Remove-Item -Force kstream-web/pnpm-lock.yaml }

      - name: Install kstream web dependencies
        working-directory: kstream-web
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        # Parent kstream-desktop/package.json would otherwise steal this install
        # (pnpm walks up and writes node_modules next to desktop, leaving vite missing).
        run: pnpm install --ignore-workspace

      - name: Build kstream web
        working-directory: kstream-web
        run: pnpm exec vite build
        env:
          VITE_APP_DOMAIN: http://127.0.0.1
          VITE_NORMAL_ROUTER: 'true'
          VITE_HAS_ONBOARDING: 'true'
          VITE_CORS_PROXY_URL: /api/proxy
          VITE_M3U8_PROXY_URL: /api

      - name: Embed web UI into desktop resources
        shell: pwsh
        run: |
          $dest = "resources/web"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Recurse -Force "kstream-web/dist/*" $dest
          if (-not (Test-Path "$dest/index.html")) {
            throw "kstream web build did not produce index.html"
          }
          Write-Host "Bundled web UI files:" (Get-ChildItem $dest -Recurse -File | Measure-Object).Count

      - name: Install desktop dependencies
        run: pnpm install --config.block-exotic-subdeps=false

      - name: Verify electron-builder templates
        shell: pwsh
        run: |
          $templates = Get-ChildItem -Path node_modules -Recurse -Filter allowOnlyOneInstallerInstance.nsh -ErrorAction SilentlyContinue
          if (-not $templates) {
            $includeDirs = Get-ChildItem -Path node_modules\.pnpm -Recurse -Directory -Filter include -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'app-builder-lib.*templates\\nsis\\include$' }
            if (-not $includeDirs) { throw "electron-builder NSIS include directory is missing" }
            $fallback = @'
!macro ALLOW_ONLY_ONE_INSTALLER_INSTANCE
!macroend
!macro CHECK_APP_RUNNING
!macroend
'@
            foreach ($dir in $includeDirs) {
              Set-Content -LiteralPath (Join-Path $dir.FullName 'allowOnlyOneInstallerInstance.nsh') -Value $fallback -Encoding ascii
            }
            Write-Host "Restored fallback NSIS template in $($includeDirs.Count) package path(s)"
            exit 0
          }
          $source = $templates | Select-Object -First 1
          $targets = Get-ChildItem -Path node_modules -Recurse -Directory -Filter include -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'app-builder-lib.*templates\\nsis\\include$' }
          foreach ($target in $targets) {
            $destination = Join-Path $target.FullName $source.Name
            if (-not (Test-Path -LiteralPath $destination)) {
              Copy-Item -LiteralPath $source.FullName -Destination $destination
              Write-Host "Restored NSIS template at $destination"
            }
          }

      - name: Report signing mode
        shell: pwsh
        run: |
          if ($env:AZURE_TENANT_ID -and $env:AZURE_CLIENT_ID -and $env:AZURE_CLIENT_SECRET -and $env:AZURE_CODE_SIGNING_ENDPOINT -and $env:AZURE_CODE_SIGNING_ACCOUNT_NAME -and $env:AZURE_CERT_PROFILE_NAME) {
            Write-Host "Azure Artifact Signing secrets present — build will be SIGNED"
          } else {
            Write-Host "Azure signing secrets missing — build will be UNSIGNED (SmartScreen warning expected)"
          }

      - name: Build Windows x64
        # Never publish from electron-builder (it creates draft releases when GH_TOKEN is set).
        run: pnpm run dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kstream-windows-x64
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          retention-days: 30

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: kstream-windows-x64
          path: dist

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Uploading assets to $TAG"
          if ! gh release view "$TAG" --repo kdesaFX/kstream-desktop >/dev/null 2>&1; then
            gh release create "$TAG" --repo kdesaFX/kstream-desktop --title "kstream $TAG" --notes "kstream desktop release $TAG" --latest
          else
            gh release edit "$TAG" --repo kdesaFX/kstream-desktop --draft=false --latest || true
          fi
          for f in dist/*; do
            if [ -f "$f" ]; then
              echo "Uploading $(basename "$f")"
              gh release upload "$TAG" "$f" --repo kdesaFX/kstream-desktop --clobber
            fi
          done
          gh release edit "$TAG" --repo kdesaFX/kstream-desktop --draft=false --latest || true

      - name: Mirror installer to kstream R2 CDN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          EXE=$(ls dist/*Setup*.exe dist/kstream-Setup.exe 2>/dev/null | head -n1 || true)
          if [ -z "$EXE" ] || [ ! -f "$EXE" ]; then
            echo "No Setup.exe in dist — skip R2 mirror"
            exit 0
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set on kstream-desktop — kstream cron will sync within ~4h"
            exit 0
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            CLOUDFLARE_ACCOUNT_ID=$(curl -sf -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts?per_page=1" \
              | jq -r '.result[0].id // empty')
          fi
          export CLOUDFLARE_ACCOUNT_ID
          echo "Mirroring $(basename "$EXE") ($(du -h "$EXE" | cut -f1)) to R2 kstream-downloads"
          npx --yes wrangler@4.54.0 r2 object put \
            kstream-downloads/kstream-Setup.exe \
            --file "$EXE" \
            --content-type application/octet-stream \
            --remote

      - name: Ping kstream sync workflow
        env:
          GH_TOKEN: ${{ secrets.KSTREAM_WORKFLOW_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No KSTREAM_WORKFLOW_TOKEN — kstream cron will sync within ~4h"
            exit 0
          fi
          gh api repos/kdesaFX/kstream/dispatches -f event_type=desktop-release
          echo "Dispatched desktop-release to kstream"
