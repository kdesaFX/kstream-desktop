name: Build and Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Azure Artifact Signing (optional — unsigned if secrets missing)
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
      AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
      AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
      AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --config.block-exotic-subdeps=false

      - name: Report signing mode
        shell: pwsh
        run: |
          if ($env:AZURE_TENANT_ID -and $env:AZURE_CLIENT_ID -and $env:AZURE_CLIENT_SECRET -and $env:AZURE_CODE_SIGNING_ENDPOINT -and $env:AZURE_CODE_SIGNING_ACCOUNT_NAME -and $env:AZURE_CERT_PROFILE_NAME) {
            Write-Host "Azure Artifact Signing secrets present — build will be SIGNED"
          } else {
            Write-Host "Azure signing secrets missing — build will be UNSIGNED (SmartScreen warning expected)"
          }

      - name: Build Windows x64
        # Never publish from electron-builder (it creates draft releases when GH_TOKEN is set).
        run: pnpm run dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kstream-windows-x64
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          retention-days: 30

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: kstream-windows-x64
          path: dist

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Uploading assets to $TAG"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "kstream $TAG" --notes "kstream desktop Core release $TAG" --latest
          else
            gh release edit "$TAG" --draft=false --latest || true
          fi
          for f in dist/*; do
            if [ -f "$f" ]; then
              echo "Uploading $(basename "$f")"
              gh release upload "$TAG" "$f" --clobber
            fi
          done
          gh release edit "$TAG" --draft=false --latest || true
