name: Build and Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows x64
        # Never publish from electron-builder (it creates draft releases when GH_TOKEN is set).
        run: npm run dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kstream-windows-x64
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          retention-days: 30

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: kstream-windows-x64
          path: dist

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Uploading assets to $TAG"
          # Ensure release exists (tag push may not create one yet)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "kstream $TAG" --notes "kstream desktop Core release $TAG" --latest
          else
            # Publish if electron-builder (or a previous run) left a draft
            gh release edit "$TAG" --draft=false --latest || true
          fi
          for f in dist/*; do
            if [ -f "$f" ]; then
              echo "Uploading $(basename "$f")"
              gh release upload "$TAG" "$f" --clobber
            fi
          done
          gh release edit "$TAG" --draft=false --latest || true
